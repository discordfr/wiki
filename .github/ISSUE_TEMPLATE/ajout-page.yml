name: Suggestion d'ajout
description: Suggérez un nouvel article à ajouter au Wiki Discord FR
title: "[Suggestion]: Ajout de l'article 'TITRE'"
labels: ["ajout"]
body:
  - type: input
    id: title
    attributes:
      label: Titre de l'article
      description: Quel devrait être le titre de l'article que vous souhaitez voir sur le Wiki ?
      placeholder: ex. Abonnements Nitro
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Qu'est-ce cet article devrait contenir comme information·s ?
      placeholder: |
        ex. - Liste des abonnements Nitro disponibles
        - Avantages de chaque abonnement
        - Comment s'abonner
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Informations supplémentaires
      description: Il y a-t-il des information additionnelles que vous souhaitez ajouter à l'Issue ? (ex. liens vers documentation, images, etc.)
      placeholder: |
        ex. Avantages de chaque abonnement : https://discord.com/nitro
    validations:
      required: false
  - type: checkboxes
    id: validation
    attributes:
      label: Avant de valider
      options:
        - label: J'ai bien vérifié que l'article n'existait pas déjà, et n'a pas déjà été suggéré
          required: true
        - label: J'ai bien lu et accepté les règles de contribution du Wiki
          required: true
        - label: Je souhaite participer à la rédaction de l'article si ma suggestion est acceptée
          required: false
